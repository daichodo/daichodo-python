[project]
name = "daichodo"
version = "0.1.0"
description = "Official Python client for the Daichodo API: Japanese qualified invoice issuer (適格請求書発行事業者) and corporate number (法人番号) lookup, validation, and change detection."
authors = [{ name = "Daichodo" }]
license = { text = "MIT" }
keywords = ["japan", "compliance", "api", "sdk", "invoice"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.23.1,<0.29.0",
    "attrs>=22.2.0",
]

[project.urls]
Homepage = "https://daichodo.com"
Documentation = "https://daichodo.com/en/docs/"
Repository = "https://github.com/daichodo/daichodo-python"

[tool.pdm]
distribution = true

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
