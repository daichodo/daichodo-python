name: publish

# Per-package tags, mirroring daichodo-node:
#
#   validate-v0.1.0  ->  daichodo-validate
#   client-v0.1.0    ->  daichodo
#
# The validator is useful today; the client targets an API that is not deployed
# yet. Publishing them together would put a client on PyPI that cannot work, and
# PyPI never allows a version number to be reused.

on:
  push:
    tags:
      - 'validate-v*'
      - 'client-v*'

permissions:
  contents: read
  id-token: write   # PyPI trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Work out what is being released
        id: target
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            validate-v*) DIR=packages/daichodo-validate; VERSION="${TAG#validate-v}" ;;
            client-v*)   DIR=packages/daichodo;          VERSION="${TAG#client-v}" ;;
            *) echo "::error::unrecognised tag $TAG"; exit 1 ;;
          esac
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $DIR at $VERSION"

      - name: Take the version from the tag
        run: |
          python - "${{ steps.target.outputs.dir }}/pyproject.toml" "${{ steps.target.outputs.version }}" <<'PY'
          import pathlib, re, sys
          manifest = pathlib.Path(sys.argv[1])
          text = manifest.read_text(encoding="utf-8")
          # Only the first `version =`; a dependency pin later in the file must
          # not be rewritten.
          text = re.sub(r'^version = ".*"$', f'version = "{sys.argv[2]}"',
                        text, count=1, flags=re.MULTILINE)
          manifest.write_text(text, encoding="utf-8")
          print(f"{manifest}: {sys.argv[2]}")
          PY

      - name: Test the validator
        # Run regardless of which package is being released: both assert against
        # the same check-digit vectors, and a release should not proceed if that
        # contract is broken.
        run: |
          pip install -e packages/daichodo-validate pytest
          pytest packages/daichodo-validate/tests -q

      - name: Build
        run: |
          pip install build
          python -m build --outdir dist "${{ steps.target.outputs.dir }}"

      - name: Publish
        # Trusted publishing: no long-lived token to rotate or leak. Configure
        # the publisher at pypi.org for each project first.
        uses: pypa/gh-action-pypi-publish@release/v1
